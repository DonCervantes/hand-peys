name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "testnet o mainnet"
        required: true
        default: testnet
        type: choice
        options: [testnet, mainnet]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @hand-peys/web build
        env:
          VITE_POLLAR_API_KEY: ${{ secrets.VITE_POLLAR_API_KEY }}
          VITE_STELLAR_NETWORK: ${{ inputs.environment }}
      - name: Migraciones D1
        working-directory: apps/api
        run: npx wrangler d1 migrations apply ${{ inputs.environment == 'mainnet' && 'hand-peys-db-mainnet' || 'hand-peys-db' }} --remote ${{ inputs.environment == 'mainnet' && '--env mainnet' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: wrangler deploy
        working-directory: apps/api
        run: npx wrangler deploy ${{ inputs.environment == 'mainnet' && '--env mainnet' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
